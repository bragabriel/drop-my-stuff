<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- %BASE_URL% é substituído pelo Vite no valor de `base` (subcaminho do GitHub Pages) -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />

    <title>DropMyStuff — itens pessoais à venda</title>
    <meta
      name="description"
      content="Vitrine de itens pessoais usados à venda: eletrônicos, casa, moda e música. Item por item, com fotos e estado de conservação. Contato por Instagram ou WhatsApp."
    />
    <link rel="canonical" href="https://bragabriel.github.io/drop-my-stuff/" />

    <!-- Open Graph — preview ao compartilhar no Instagram/WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bragabriel.github.io/drop-my-stuff/" />
    <meta property="og:site_name" content="DropMyStuff" />
    <meta property="og:title" content="DropMyStuff — itens pessoais à venda" />
    <meta
      property="og:description"
      content="Vitrine de itens pessoais usados à venda: eletrônicos, casa, moda e música. Contato por Instagram ou WhatsApp."
    />
    <meta property="og:image" content="https://bragabriel.github.io/drop-my-stuff/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="DropMyStuff — vitrine de itens pessoais à venda"
    />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DropMyStuff — itens pessoais à venda" />
    <meta
      name="twitter:description"
      content="Vitrine de itens pessoais usados à venda: eletrônicos, casa, moda e música. Contato por Instagram ou WhatsApp."
    />
    <meta name="twitter:image" content="https://bragabriel.github.io/drop-my-stuff/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

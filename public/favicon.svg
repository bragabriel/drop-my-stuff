<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#EAE7DE" />
  <!-- Letra "D" chapada, impressa duas vezes fora de registro (azul atrás,
       rosa na frente) — cada camada é a mesma forma com seu próprio
       contador (evenodd), simulando as duas passadas de tinta do risógrafo. -->
  <path
    d="M9 6.5h8a9.5 9.5 0 0 1 0 19H9zM13 11h4a5 5 0 0 1 0 10h-4z"
    fill="#2B44A8"
    fill-rule="evenodd"
    transform="translate(1.6 1.1)"
  />
  <path
    d="M9 6.5h8a9.5 9.5 0 0 1 0 19H9zM13 11h4a5 5 0 0 1 0 10h-4z"
    fill="#FF3D8B"
    fill-rule="evenodd"
  />
</svg>

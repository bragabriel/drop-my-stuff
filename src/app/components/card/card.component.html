<div class="card">
  <!-- Image Carousel -->
  <div class="card-image-container">
    <div class="image-wrapper">
      <img [src]="currentImage" [alt]="item.title" class="card-image" />
      
      <!-- Title Overlay -->
      <div class="title-overlay">
        <h3>{{ item.title }}</h3>
      </div>

      <!-- Carousel Navigation -->
      @if (hasMultipleImages) {
        <button class="carousel-btn prev" (click)="previousImage()" aria-label="Previous image">
          ‹
        </button>
        <button class="carousel-btn next" (click)="nextImage()" aria-label="Next image">
          ›
        </button>
      }

      <!-- Image Indicators -->
      @if (hasMultipleImages) {
        <div class="image-indicators">
          @for (img of item.images; track $index) {
            <span 
              class="indicator" 
              [class.active]="$index === currentImageIndex">
            </span>
          }
        </div>
      }
    </div>
  </div>

  <!-- Card Content -->
  <div class="card-content">
    <!-- Category and Condition -->
    <div class="card-meta">
      <span class="category">{{ item.category }}</span>
      <span class="condition" [ngClass]="conditionClass">{{ conditionLabel }}</span>
    </div>

    <!-- Description (Scrollable) -->
    <div class="card-description">
      <p>{{ item.description }}</p>
    </div>

    <!-- Price (Fixed at bottom) -->
    <div class="card-price">
      <span class="price">{{ formatPrice(item.price) }}</span>
    </div>
  </div>
</div>
